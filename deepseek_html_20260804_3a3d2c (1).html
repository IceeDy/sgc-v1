<script src="sgc-core.js"></script>
<script>
  // ============================================================
  // 1. CONFIGURAÇÃO E ESTADO GLOBAL
  // ============================================================
  const DB_NAME = 'SGC_DB';
  const DB_VERSION = 4;
  let db = null;
  let currentPage = 'dashboard';

  const STORES = ['produtos', 'fornecedores', 'produto_fornecedor', 'historico_precos', 'cotacoes', 'itens_cotacao', 'pedidos', 'pedidos_compra', 'itens_pedido', 'historicos', 'historico_compras', 'importacoes', 'estoque'];

  // ============================================================
  // 2. INICIALIZAÇÃO DO INDEXEDDB
  // ============================================================
  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        STORES.forEach(storeName => {
          if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName, { keyPath: 'id', autoIncrement: true });
          }
        });
      };
      request.onsuccess = (e) => { db = e.target.result; resolve(db); };
      request.onerror = (e) => reject(e.target.error);
    });
  }

  // ============================================================
  // 3. FUNÇÕES CRUD GENÉRICAS
  // ============================================================
  function getAll(storeName) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readonly');
      const store = tx.objectStore(storeName);
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function getById(storeName, id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readonly');
      const store = tx.objectStore(storeName);
      const req = store.get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function add(storeName, data) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const req = store.add(data);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function put(storeName, data) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const req = store.put(data);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function del(storeName, id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const req = store.delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  function clearStore(storeName) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const req = store.clear();
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  // ============================================================
  // 4. LÓGICA DE NEGÓCIO
  // ============================================================
  const sgcCore = window.SGC;
  const PARAMETROS_SGC = (sgcCore && sgcCore.PARAMETROS_SGC) ? sgcCore.PARAMETROS_SGC : { dias_producao: 7, lead_time: 3, cobertura_minima: 10, limite_excesso: 20 };
  window.PARAMETROS_SGC = PARAMETROS_SGC;

  function toNumber(value, fallback = 0) {
    const parsed = Number(value);
    return Number.isFinite(parsed) ? parsed : fallback;
  }

  function normalizeText(value) {
    return String(value || '')
      .normalize('NFKD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^A-Z0-9\s]/g, '')
      .trim()
      .toUpperCase()
      .replace(/\s+/g, ' ');
  }

  async function registrarHistoricoPreco({ produto_id, fornecedor_id, data, preco_unitario, quantidade = 1, origem = 'manual' }) {
    if (!produto_id || !fornecedor_id) {
      return false;
    }
    const produto = await getById('produtos', produto_id);
    const fornecedor = await getById('fornecedores', fornecedor_id);
    if (!produto || !fornecedor) {
      return false;
    }
    await add('historico_precos', {
      produto_id: parseInt(produto_id),
      fornecedor_id: parseInt(fornecedor_id),
      data: data || new Date().toISOString().split('T')[0],
      preco_unitario: toNumber(preco_unitario || 0),
      quantidade: toNumber(quantidade || 1),
      origem,
    });
    return true;
  }

  async function buscarMelhorFornecedor(produto_id) {
    const produto = await getById('produtos', produto_id);
    if (!produto) return null;

    const relacoes = await getAll('produto_fornecedor');
    const historicoPrecos = await getAll('historico_precos');
    const fornecedores = await getAll('fornecedores');
    const fornecedoresMap = {}; fornecedores.forEach(fornecedor => fornecedoresMap[fornecedor.id] = fornecedor);

    const relacoesProduto = relacoes.filter(relacao => String(relacao.produto_id) === String(produto_id));
    if (!relacoesProduto.length) {
      const fornecedorBase = fornecedores.find(fornecedor => String(fornecedor.id) === String(produto.fornecedor_id));
      return {
        produto_id: produto.id,
        fornecedor_id: fornecedorBase?.id || null,
        fornecedor_nome: fornecedorBase?.nome || 'Não definido',
        ultimo_preco: toNumber(produto.ultimo_preco || 0),
        data_ultimo_preco: produto.data_ultima_compra || null,
        prazo_entrega: fornecedorBase?.prazo_medio_entrega || fornecedorBase?.prazo_entrega || 3,
        menor_preco_historico: toNumber(produto.ultimo_preco || 0),
        quantidade_compras: 0,
      };
    }

    const ranking = relacoesProduto.map(relacao => {
      const historico = historicoPrecos.filter(item => String(item.produto_id) === String(produto_id) && String(item.fornecedor_id) === String(relacao.fornecedor_id));
      const ultimoRegistro = historico.sort((a, b) => new Date(b.data || 0) - new Date(a.data || 0))[0];
      const fornecedor = fornecedoresMap[relacao.fornecedor_id];
      return {
        produto_id: produto.id,
        fornecedor_id: relacao.fornecedor_id,
        fornecedor_nome: fornecedor?.nome || 'Não definido',
        ultimo_preco: toNumber(relacao.ultimo_preco || ultimoRegistro?.preco_unitario || 0),
        data_ultimo_preco: relacao.data_ultimo_preco || ultimoRegistro?.data || null,
        prazo_entrega: toNumber(relacao.prazo_entrega || fornecedor?.prazo_medio_entrega || fornecedor?.prazo_entrega || 3),
        menor_preco_historico: historico.length ? Math.min(...historico.map(item => toNumber(item.preco_unitario || 0)).filter(Boolean)) : toNumber(relacao.ultimo_preco || 0),
        quantidade_compras: historico.length,
      };
    });

    return ranking.sort((a, b) => {
      if (a.ultimo_preco !== b.ultimo_preco) return a.ultimo_preco - b.ultimo_preco;
      if (a.prazo_entrega !== b.prazo_entrega) return a.prazo_entrega - b.prazo_entrega;
      return b.quantidade_compras - a.quantidade_compras;
    })[0] || null;
  }

  function getNextInternalCode(existingProdutos = []) {
    const numeros = existingProdutos
      .map(produto => {
        const match = String(produto.codigo_interno || produto.codigo || '').match(/-(\d+)$/);
        return match ? parseInt(match[1], 10) : null;
      })
      .filter(value => Number.isInteger(value));
    const next = numeros.length ? Math.max(...numeros) + 1 : 1;
    return `PRODUTO-SEM-CODIGO-${String(next).padStart(4, '0')}`;
  }

        { nome: 'Fornecedor C', cnpj: '33.333.333/0001-33', contato: 'Carla', telefone: '11999990003', email: 'carla@fornecedora.com', prazo_medio_entrega: 7, observacao: 'Entrega mais lenta', ativo: true },
      ];
      for (const fornecedor of fornecedoresBase) {

    }

        { codigo: 'OLEO03', descricao: 'Óleo de soja 900ml', categoria: 'Alimentos', unidade: 'UN', estoque_atual: 12, consumo_medio_mensal: 120, ultimo_preco: 8.50, tipo_compra: 'Produção normal' },
        { codigo: 'CAFÉ04', descricao: 'Café torrado 500g', categoria: 'Bebidas', unidade: 'UN', estoque_atual: 8, consumo_medio_mensal: 90, ultimo_preco: 18.40, tipo_compra: 'Produção normal' },
        { codigo: 'SAL05', descricao: 'Sal refinado 1kg', categoria: 'Alimentos', unidade: 'UN', estoque_atual: 10, consumo_medio_mensal: 70, ultimo_preco: 3.90, tipo_compra: 'Produção normal' },

        { produto_id: produtos[2]?.id, fornecedor_id: fornecedores[2]?.id, codigo_fornecedor: 'C300', ultimo_preco: 8.90, data_ultimo_preco: '2026-07-17', prazo_entrega: 7, quantidade_minima: 8, observacao: 'Mais caro' },
        { produto_id: produtos[3]?.id, fornecedor_id: fornecedores[1]?.id, codigo_fornecedor: 'B400', ultimo_preco: 17.80, data_ultimo_preco: '2026-07-21', prazo_entrega: 5, quantidade_minima: 6, observacao: 'Bom preço' },

        { produto_id: produtosSeed[0]?.id, fornecedor_id: fornecedoresSeed[1]?.id, data: '2026-06-03', preco_unitario: 28.50, quantidade: 12, origem: 'cotação' },

  function getParametrosSgc() {
    return (sgcCore && sgcCore.PARAMETROS_SGC) ? sgcCore.PARAMETROS_SGC : window.PARAMETROS_SGC;
  }

  function atualizarParametrosSgc(novosParametros) {
    const params = getParametrosSgc();
    Object.assign(params, novosParametros);
    if (sgcCore) sgcCore.PARAMETROS_SGC = params;
    window.PARAMETROS_SGC = params;
    return params;
  }

  function calcularConsumoSemanal(consumoMensal) {
    return sgcCore ? sgcCore.calcularConsumoSemanal(consumoMensal) : parseFloat((consumoMensal / 4.3333).toFixed(2));
  }

  function calcularConsumoDiario(consumoMensal) {
    return sgcCore ? sgcCore.calcularConsumoDiario(consumoMensal) : parseFloat((consumoMensal / 30).toFixed(2));
  }

  function calcularEstoqueMinimo(consumoDiario, prazoEntrega = getParametrosSgc().lead_time, margemSeguranca = 0.2) {
    return sgcCore ? sgcCore.calcularEstoqueSeguranca(consumoDiario, prazoEntrega, margemSeguranca) : Math.ceil(consumoDiario * prazoEntrega * (1 + margemSeguranca));
  }

  function calcularDiasEstoque(estoqueAtual, consumoDiario) {
    return sgcCore ? sgcCore.calcularCoberturaDias(estoqueAtual, consumoDiario) : (consumoDiario === 0 ? Infinity : parseFloat((estoqueAtual / consumoDiario).toFixed(1)));
  }

  function calcularStatus(produtoOuCobertura) {
    return sgcCore ? sgcCore.calcularStatusCompra(produtoOuCobertura) : (typeof produtoOuCobertura === 'object' ? 'NORMAL' : (produtoOuCobertura > 20 ? 'EXCESSO' : produtoOuCobertura > 10 ? 'NORMAL' : produtoOuCobertura >= 3 ? 'ATENÇÃO' : 'URGENTE'));
  }

  function quantidadeSugerida(consumoDiario, estoqueAtual, recebendo = 0) {
    return sgcCore ? sgcCore.calcularQuantidadeSugerida(consumoDiario, estoqueAtual, recebendo) : Math.max(0, Math.ceil((consumoDiario * 10) - estoqueAtual - recebendo));
  }

  async function registrarEvento(tipoEvento, referencia, descricao, usuario = 'Sistema') {
    await add('historico_compras', {
      tipo_evento: tipoEvento,
      data: new Date().toISOString(),
      usuario,
      referencia,
      descricao,
    });
  }

  function calcularStatusPedido(itensPedido = []) {
    if (!itensPedido.length) return 'PENDENTE';
    const totalSolicitado = itensPedido.reduce((sum, item) => sum + toNumber(item.quantidade), 0);
    const totalRecebido = itensPedido.reduce((sum, item) => sum + toNumber(item.recebido), 0);
    if (totalRecebido >= totalSolicitado) return 'RECEBIDO';
    if (totalRecebido > 0) return 'PARCIALMENTE_RECEBIDO';
    return 'PENDENTE';
  }

  // ============================================================
  // 5. IMPORTAÇÃO DA PLANILHA (CORRIGIDA)
  // ============================================================
  function importarPlanilha(arrayBuffer) {
    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
    const produtos = sgcCore ? sgcCore.parsePlanilhaRows(data) : [];
    return produtos;
  }

  // ============================================================
  // 6. RENDERIZAÇÃO DAS PÁGINAS
  // ============================================================
  let dashboardFilters = { status: 'todos', fornecedor: 'todos', categoria: 'todos' };

  function getResumoDashboardProduto(produto, fornecedorMap = {}, historicos = [], pedidos = [], itensPedido = [], cotacoes = [], itensCotacao = []) {
    const consumoDiario = calcularConsumoDiario(produto.consumo_medio_mensal || 0);
    const estoqueAtual = toNumber(produto.estoque_atual || 0);
    const recebendo = toNumber(produto.recebendo || 0);
    const coberturaDias = calcularDiasEstoque(estoqueAtual, consumoDiario);
    const status = calcularStatus({ consumo_medio_mensal: produto.consumo_medio_mensal || 0, estoque_atual: estoqueAtual });

    const historicoProduto = historicos.filter(h => String(h.produto_id) === String(produto.id)).sort((a, b) => new Date(b.data || 0) - new Date(a.data || 0));
    const ultimoPreco = toNumber(historicoProduto[0]?.preco_unitario || produto.ultimo_preco || 0);

    let fornecedorPrincipal = produto.fornecedor_id || null;
    if (!fornecedorPrincipal) {
      const ultimoHistorico = historicoProduto[0];
      if (ultimoHistorico?.fornecedor_id) fornecedorPrincipal = ultimoHistorico.fornecedor_id;
      else {
        const itemCotacao = itensCotacao.filter(item => String(item.produto_id) === String(produto.id)).sort((a, b) => (b.id || 0) - (a.id || 0))[0];
        if (itemCotacao) {
          const cotacao = cotacoes.find(c => c.id === itemCotacao.cotacao_id);
          fornecedorPrincipal = cotacao?.fornecedor_id || null;
        }
      }
    }

    const necessidade10Dias = consumoDiario * 10;
    const quantidadeSugerida = Math.max(0, Math.ceil(necessidade10Dias - estoqueAtual - recebendo));

    return {
      produto,
      consumoDiario,
      estoqueAtual,
      recebendo,
      coberturaDias,
      status,
      fornecedorPrincipal,
      fornecedorNome: fornecedorPrincipal ? (fornecedorMap[fornecedorPrincipal] || 'Não definido') : 'Não definido',
      ultimoPreco,
      necessidade10Dias,
      quantidadeSugerida,
      valorEstimado: ultimoPreco * quantidadeSugerida,
    };
  }

  async function renderDashboard() {

    const pedidos = await getAll('pedidos_compra');
    const itensPedido = await getAll('itens_pedido');
    const fornecedores = await getAll('fornecedores');
    const cotacoes = await getAll('cotacoes');
    const itensCotacao = await getAll('itens_cotacao');
    const historicoCompras = await getAll('historico_compras');
    const historicos = historicoCompras.length ? historicoCompras : await getAll('historicos');

    const fornecedorMap = {};
    fornecedores.forEach(f => fornecedorMap[f.id] = f.nome);

    const produtosComResumo = await Promise.all(produtos.map(async produto => {
      const resumo = getResumoDashboardProduto(produto, fornecedorMap, historicos, pedidos, itensPedido, cotacoes, itensCotacao);
      const recomendacao = await buscarMelhorFornecedor(produto.id);
      const menorPrecoHistorico = recomendacao?.menor_preco_historico || resumo.ultimoPreco || 0;
      const economiaPossivel = Math.max(0, (resumo.quantidadeSugerida * menorPrecoHistorico) - (resumo.quantidadeSugerida * resumo.ultimoPreco));
      return {
        ...resumo,
        recomendacao,
        menorPrecoHistorico,
        economiaPossivel,
      };
    }));

    const produtosFiltrados = produtosComResumo.filter(item => {
      const statusOk = dashboardFilters.status === 'todos' || item.status === dashboardFilters.status;
      const fornecedorOk = dashboardFilters.fornecedor === 'todos' || String(item.fornecedorPrincipal) === String(dashboardFilters.fornecedor);
      const categoriaOk = dashboardFilters.categoria === 'todos' || String(item.produto.categoria || '').toLowerCase() === dashboardFilters.categoria.toLowerCase();
      return statusOk && fornecedorOk && categoriaOk;
    }).sort((a, b) => {
      const ordemStatus = { URGENTE: 0, ATENÇÃO: 1, NORMAL: 2, EXCESSO: 3, 'SEM HISTÓRICO': 4, MONITORAR: 5 };
      const statusA = ordemStatus[a.status] ?? 99;
      const statusB = ordemStatus[b.status] ?? 99;
      if (statusA !== statusB) return statusA - statusB;
      return a.produto.descricao.localeCompare(b.produto.descricao);
    });

    const criticos = produtosComResumo.filter(item => item.status === 'URGENTE');
    const emAtencao = produtosComResumo.filter(item => item.status === 'ATENÇÃO');
    const semHistorico = produtosComResumo.filter(item => item.status === 'SEM HISTÓRICO');
    const emExcesso = produtosComResumo.filter(item => item.status === 'EXCESSO');

    const pedidosAbertos = pedidos.filter(pedido => pedido.status !== 'RECEBIDO');
    const pedidosAtrasados = pedidosAbertos.filter(pedido => {
      const fornecedor = fornecedores.find(f => f.id === pedido.fornecedor_id);
      const prazo = toNumber(fornecedor?.prazo_entrega || 3);
      const dataPedido = new Date(pedido.data || 0);
      const diff = (new Date() - dataPedido) / (1000 * 60 * 60 * 24);
      return diff > prazo;
    });

    const valorPendente = pedidosAbertos.reduce((sum, pedido) => {
      const itens = itensPedido.filter(item => item.pedido_id === pedido.id);
      const valor = itens.reduce((total, item) => total + (toNumber(item.valor_unitario) * toNumber(item.quantidade - item.recebido || 0)), 0);
      return sum + valor;

    const itensAguardandoEntrega = itensPedido.filter(item => toNumber(item.quantidade) - toNumber(item.recebido) > 0).length;

    const valorCompradoPeriodo = historicos.filter(h => {
      const d = new Date(h.data || 0);

    const coberturaMedia = produtosComResumo.length

    const abaixoLeadTime = produtosComResumo.filter(item => item.coberturaDias !== Infinity && item.coberturaDias < toNumber(getParametrosSgc().lead_time || 3)).length;
    const semConsumo = produtosComResumo.filter(item => toNumber(item.produto.consumo_medio_mensal || 0) === 0).length;
    const parados = produtosComResumo.filter(item => toNumber(item.produto.consumo_medio_mensal || 0) === 0 && toNumber(item.produto.estoque_atual || 0) === 0).length;
    const maiorConsumo = produtosComResumo.slice().sort((a, b) => toNumber(b.produto.consumo_medio_mensal || 0) - toNumber(a.produto.consumo_medio_mensal || 0))[0];

    const topConsumo = produtosComResumo.slice().sort((a, b) => toNumber(b.produto.consumo_medio_mensal || 0) - toNumber(a.produto.consumo_medio_mensal || 0)).slice(0, 10);
    const topRisco = produtosComResumo.slice().sort((a, b) => {
      const riscoA = a.coberturaDias === Infinity ? 9999 : a.coberturaDias;
      const riscoB = b.coberturaDias === Infinity ? 9999 : b.coberturaDias;
      if (riscoA !== riscoB) return riscoA - riscoB;
      return (a.status === 'URGENTE' ? -1 : 1) - (b.status === 'URGENTE' ? -1 : 1);
    }).slice(0, 10);

    const comprasPorPeriodo = Object.values(historicos.reduce((acc, item) => {
      const data = new Date(item.data || 0);
      const chave = `${data.getFullYear()}-${String(data.getMonth() + 1).padStart(2, '0')}`;
      if (!acc[chave]) acc[chave] = { periodo: chave, total: 0, qtd: 0 };
      acc[chave].total += toNumber(item.total || (item.preco_unitario * item.quantidade) || 0);
      acc[chave].qtd += toNumber(item.quantidade || 0);
      return acc;
    }, {})).sort((a, b) => a.periodo.localeCompare(b.periodo));

    const produtosMaisComprados = Object.values(historicos.reduce((acc, item) => {
      const key = String(item.produto_id);
      if (!acc[key]) acc[key] = { produto_id: item.produto_id, quantidade: 0, total: 0 };
      acc[key].quantidade += toNumber(item.quantidade || 0);
      acc[key].total += toNumber(item.total || (item.preco_unitario * item.quantidade) || 0);
      return acc;
    }, {})).sort((a, b) => b.quantidade - a.quantidade).slice(0, 10);

    const variacaoPreco = produtosComResumo.filter(item => item.ultimoPreco > 0).map(item => {
      const registros = historicos.filter(h => String(h.produto_id) === String(item.produto.id));

  async function renderProdutos() {
    const produtos = await getAll('produtos');

  async function renderCotacoes() {
    const cotacoes = await getAll('cotacoes');
    const itensCotacao = await getAll('itens_cotacao');
    const produtos = await getAll('produtos');
    const fornecedores = await getAll('fornecedores');
    const prodMap = {}; produtos.forEach(p => prodMap[p.id] = p.descricao);
    const fornMap = {}; fornecedores.forEach(f => fornMap[f.id] = f.nome);

    let html = `
      <div class="d-flex justify-content-between mb-3">
        <h4>Cotações</h4>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalCotacao">+ Nova Cotação</button>
      </div>
      <div class="table-responsive">
        <table class="table table-bordered">
          <thead><tr><th>Data</th><th>Fornecedor</th><th>Status</th><th>Itens</th><th>Menor Preço</th><th>Ações</th></tr></thead>
          <tbody>
    `;
    for (const cotacao of cotacoes) {
      const itens = itensCotacao.filter(item => item.cotacao_id === cotacao.id);
      const menor = itens.length ? Math.min(...itens.map(item => item.preco_unitario || 0)) : 0;
      html += `
        <tr>
          <td>${cotacao.data}</td>
          <td>${fornMap[cotacao.fornecedor_id] || cotacao.fornecedor_id}</td>
          <td>${cotacao.status || 'Pendente'}</td>
          <td>${itens.map(item => `${prodMap[item.produto_id] || item.produto_id} (${item.quantidade})`).join('; ')}</td>
          <td>R$ ${menor.toFixed(2)}</td>
          <td>
            <button class="btn btn-sm btn-outline-success criar-pedido" data-id="${cotacao.id}"><i class="bi bi-cart-plus"></i> Criar Pedido</button>
            <button class="btn btn-sm btn-outline-danger excluir-cotacao" data-id="${cotacao.id}"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      `;
    }
    html += `</tbody></table></div>`;
    document.getElementById('page-cotacoes').innerHTML = html;

    document.querySelectorAll('.criar-pedido').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = parseInt(btn.dataset.id);
        const cotacao = await getById('cotacoes', id);
        if (!cotacao) return;
        const itens = await getAll('itens_cotacao');
        const itensCotacao = itens.filter(item => item.cotacao_id === id && (item.quantidade || 0) > 0);
        if (!itensCotacao.length) {
          alert('Cotação sem itens para criar pedido.');
          return;
        }
        if (!cotacao.fornecedor_id) {
          alert('Cotação sem fornecedor. Não é possível criar pedido.');
          return;
        }
        const pedido = {
          data: new Date().toISOString().split('T')[0],
          fornecedor_id: cotacao.fornecedor_id,
          status: 'PENDENTE',
          valor_total: itensCotacao.reduce((sum, item) => sum + ((item.preco_unitario || 0) * item.quantidade), 0),
        };
        const pedidoId = await add('pedidos_compra', pedido);
        for (const item of itensCotacao) {
          await add('itens_pedido', {
            pedido_id: pedidoId,
            produto_id: item.produto_id,
            quantidade: item.quantidade,
            valor_unitario: item.preco_unitario || 0,
            recebido: 0,
            saldo_pendente: item.quantidade,
          });
          await registrarHistoricoPreco({
            produto_id: item.produto_id,
            fornecedor_id: cotacao.fornecedor_id,
            data: cotacao.data,
            preco_unitario: item.preco_unitario || 0,
            quantidade: item.quantidade,
            origem: 'cotação',
          });
        }
        await registrarEvento('pedido criado', `pedido:${pedidoId}`, `Pedido criado para o fornecedor ${cotacao.fornecedor_id} com ${itensCotacao.length} itens.`);
        alert('Pedido criado com sucesso!');
        renderCotacoes();
        renderPedidos();
        renderDashboard();
      });
    });

    document.querySelectorAll('.excluir-cotacao').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (confirm('Excluir cotação?')) {
          const id = parseInt(btn.dataset.id);
          const itens = await getAll('itens_cotacao');
          for (const item of itens.filter(i => i.cotacao_id === id)) {
            await del('itens_cotacao', item.id);
          }
          await del('cotacoes', id);
          renderCotacoes();
        }
      });
    });
  }

  function abrirModalRecebimentoPedido(pedido, itensPedido) {
    const modal = document.createElement('div');
    modal.className = 'modal fade';
    modal.id = 'modalRecebimentoPedido';
    modal.tabIndex = -1;
    modal.innerHTML = `
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Receber Pedido #${pedido.id}</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p class="text-muted">Informe a quantidade a receber para cada item. O valor padrão é o saldo pendente.</p>
            <div id="recebimentoItens"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary" id="salvarRecebimento">Salvar Recebimento</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    const modalInstance = new bootstrap.Modal(modal);
    modalInstance.show();

    const produtos = getAll('produtos')
      .then(produtosDb => {
        const prodMap = {}; produtosDb.forEach(p => prodMap[p.id] = p);
        const container = document.getElementById('recebimentoItens');
        container.innerHTML = itensPedido.map(item => {
          const produto = prodMap[item.produto_id];
          const saldoPendente = toNumber(item.quantidade) - toNumber(item.recebido);
          return `
            <div class="row g-2 mb-2 align-items-center">
              <div class="col-md-6">
                <div>${produto?.descricao || item.produto_id}</div>
                <small class="text-muted">Saldo pendente: ${saldoPendente}</small>
              </div>
              <div class="col-md-6">
                <input type="number" class="form-control form-control-sm recebimento-quantidade" data-item-id="${item.id}" value="${saldoPendente}" min="0" max="${saldoPendente}" step="0.01">
              </div>
            </div>
          `;
        }).join('');
      });

    document.getElementById('salvarRecebimento').addEventListener('click', async () => {
      await produtos;
      const inputs = document.querySelectorAll('.recebimento-quantidade');
      let recebidoTotal = 0;
      let teveRecebimento = false;

      for (const input of inputs) {
        const itemId = parseInt(input.dataset.itemId);
        const item = itensPedido.find(i => i.id === itemId);
        if (!item) continue;
        const saldoPendente = toNumber(item.quantidade) - toNumber(item.recebido);
        const quantidadeRecebida = parseFloat(input.value) || 0;
        if (quantidadeRecebida < 0) {
          alert('A quantidade recebida não pode ser negativa.');
          return;
        }
        if (quantidadeRecebida > saldoPendente) {
          alert(`A quantidade recebida para o item ${itemId} excede o saldo pendente.`);
          return;
        }
        if (quantidadeRecebida <= 0) continue;
        teveRecebimento = true;
        item.recebido = toNumber(item.recebido) + quantidadeRecebida;
        item.saldo_pendente = Math.max(0, toNumber(item.quantidade) - toNumber(item.recebido));
        await put('itens_pedido', item);
        recebidoTotal += quantidadeRecebida;

        const produto = await getById('produtos', item.produto_id);
        if (produto) {
          produto.estoque_atual = toNumber(produto.estoque_atual) + quantidadeRecebida;
          produto.ultimo_preco = toNumber(item.valor_unitario) || produto.ultimo_preco || 0;
          produto.data_ultima_compra = pedido.data;
          await put('produtos', produto);
        }
        await add('historicos', {
          data: pedido.data,
          produto_id: item.produto_id,
          fornecedor_id: pedido.fornecedor_id,
          quantidade: quantidadeRecebida,
          preco_unitario: toNumber(item.valor_unitario),
          total: toNumber(item.valor_unitario) * quantidadeRecebida,
        });
      }

      if (!teveRecebimento) {
        alert('Informe ao menos uma quantidade para receber.');
        return;
      }

      pedido.status = calcularStatusPedido(itensPedido);
      await put('pedidos_compra', pedido);
      await registrarEvento('recebimento realizado', `pedido:${pedido.id}`, `Recebimento realizado com ${recebidoTotal} unidades. Status atualizado para ${pedido.status}.`);
      modalInstance.hide();
      renderPedidos();
      renderDashboard();
      renderProdutos();
    });

    modal.addEventListener('hidden.bs.modal', () => modal.remove());
  }

  async function renderPedidos() {

    const itensPedido = await getAll('itens_pedido');
    const fornecedores = await getAll('fornecedores');

    const fornMap = {}; fornecedores.forEach(f => fornMap[f.id] = f.nome);

        const id = parseInt(btn.dataset.id);
        const pedido = await getById('pedidos_compra', id);
        if (!pedido) return;
        const itensPedido = await getAll('itens_pedido');
        const itensDoPedido = itensPedido.filter(item => item.pedido_id === id);
        if (!itensDoPedido.length) {

          return;
        }
        if (pedido.status === 'RECEBIDO') {
          alert('Pedido já finalizado.');
          return;
        }
        abrirModalRecebimentoPedido(pedido, itensDoPedido);
      });
    });

    document.querySelectorAll('.imprimir-pedido').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = parseInt(btn.dataset.id);
        const pedido = await getById('pedidos_compra', id);

        const win = window.open('', '_blank');

  }

  async function renderImportar() {
    let html = `
      <h4>Importar Planilha Excel</h4>
      <p class="text-muted">Selecione o arquivo .xlsx do relatório de necessidade de compras.</p>
      <div class="card p-4">
        <input type="file" class="form-control" id="fileInput" accept=".xlsx">
        <button class="btn btn-primary mt-3" id="btnImportar">Importar</button>
        <div id="importPreview" class="mt-3"></div>
      </div>
    `;
    document.getElementById('page-importar').innerHTML = html;

    document.getElementById('btnImportar').addEventListener('click', async () => {
      const fileInput = document.getElementById('fileInput');
      if (!fileInput.files || fileInput.files.length === 0) {
        alert('Selecione um arquivo.');
        return;
      }
      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const produtos = importarPlanilha(data.buffer);
          if (produtos.length === 0) {
            document.getElementById('importPreview').innerHTML = `
              <div class="alert alert-warning">Nenhum produto encontrado. Verifique se a planilha contém "Código(s):" e os campos esperados.</div>
            `;
            return;
          }
          let preview = `<h6>${produtos.length} produtos encontrados</h6>
            <div class="table-responsive" style="max-height:300px; overflow-y:auto;">
            <table class="table table-sm table-bordered">
              <thead><tr><th>Código</th><th>Descrição</th><th>Estoque</th><th>Média Mensal</th></tr></thead>
              <tbody>`;
          produtos.slice(0,20).forEach(p => {
            preview += `<tr><td>${p.codigo}</td><td>${p.descricao.substring(0,60)}</td><td>${p.estoque_atual}</td><td>${p.consumo_medio_mensal}</td></tr>`;
          });
          preview += `</tbody></table></div>`;
          if (produtos.length > 20) preview += `<p class="text-muted">... e mais ${produtos.length - 20} produtos</p>`;
          preview += `<button class="btn btn-success mt-2" id="confirmarImportacao">Confirmar Importação</button>`;
          document.getElementById('importPreview').innerHTML = preview;

          document.getElementById('confirmarImportacao').addEventListener('click', async () => {
            const produtosExistentes = await getAll('produtos');
            const mapaCodigo = new Map();
            const mapaDescricao = new Map();
            produtosExistentes.forEach(produto => {
              if (produto.codigo) mapaCodigo.set(normalizeText(produto.codigo), produto);
              if (produto.descricao) mapaDescricao.set(normalizeText(produto.descricao), produto);
            });

            let criados = 0;
            let atualizados = 0;
            for (const p of produtos) {
              const codigoOrigem = typeof p.codigo === 'string' ? p.codigo.trim() : '';
              const codigoNormalizado = normalizeText(codigoOrigem);
              const descricaoNormalizada = normalizeText(p.descricao || '');
              let produtoExistente = null;

              if (codigoNormalizado) {
                produtoExistente = mapaCodigo.get(codigoNormalizado) || null;
              }
              if (!produtoExistente && descricaoNormalizada) {
                produtoExistente = mapaDescricao.get(descricaoNormalizada) || null;
              }

              if (produtoExistente) {
                produtoExistente.estoque_atual = toNumber(p.estoque_atual || produtoExistente.estoque_atual || 0);
                produtoExistente.consumo_medio_mensal = toNumber(p.consumo_medio_mensal || produtoExistente.consumo_medio_mensal || 0);
                produtoExistente.saldo_inicial = toNumber(p.saldo_inicial || produtoExistente.saldo_inicial || 0);
                produtoExistente.recebendo = toNumber(p.recebendo || produtoExistente.recebendo || 0);
                produtoExistente.saldo_final = toNumber(p.saldo_final || produtoExistente.saldo_final || 0);
                produtoExistente.codigo_origem = produtoExistente.codigo_origem || codigoOrigem || '';
                produtoExistente.descricao = produtoExistente.descricao || p.descricao || '';
                produtoExistente.tipo_compra = produtoExistente.tipo_compra || p.tipo_compra || 'Produção normal';
                produtoExistente.ultimo_preco = produtoExistente.ultimo_preco || p.ultimo_preco || 0;
                produtoExistente.data_ultima_compra = produtoExistente.data_ultima_compra || p.data_ultima_compra || null;
                if (!produtoExistente.codigo && !produtoExistente.codigo_interno && !codigoNormalizado) {
                  produtoExistente.codigo_interno = getNextInternalCode(produtosExistentes);
                }
                await put('produtos', produtoExistente);
                atualizados += 1;
                continue;
              }

              const codigoInterno = codigoNormalizado ? '' : getNextInternalCode(produtosExistentes);
              const novoProduto = {
                codigo: codigoNormalizado ? codigoOrigem : '',
                codigo_origem: codigoNormalizado ? codigoOrigem : '',
                codigo_interno: codigoInterno,
                descricao: p.descricao || '',
                categoria: p.categoria || '',
                unidade: p.unidade || '',
                estoque_atual: toNumber(p.estoque_atual || 0),
                consumo_medio_mensal: toNumber(p.consumo_medio_mensal || 0),
                saldo_inicial: toNumber(p.saldo_inicial || 0),
                recebendo: toNumber(p.recebendo || 0),
                avariado: toNumber(p.avariado || 0),
                saldo_final: toNumber(p.saldo_final || 0),
                fornecedor_id: p.fornecedor_id || null,
                ultimo_preco: toNumber(p.ultimo_preco || 0),
                data_ultima_compra: p.data_ultima_compra || null,
                tipo_compra: p.tipo_compra || 'Produção normal',
              };
              await add('produtos', novoProduto);
              criados += 1;
              produtosExistentes.push(novoProduto);
              if (novoProduto.codigo) mapaCodigo.set(normalizeText(novoProduto.codigo), novoProduto);
              if (novoProduto.descricao) mapaDescricao.set(normalizeText(novoProduto.descricao), novoProduto);
            }

            await registrarEvento('importação realizada', 'importacao', `Importação concluída: ${criados} criados e ${atualizados} atualizados.`);
            alert(`${produtos.length} produtos processados (${criados} novos, ${atualizados} atualizados).`);
            document.getElementById('importPreview').innerHTML = '';
            renderDashboard();
            renderProdutos();
            renderNecessidade();
          });
        } catch (err) {
          document.getElementById('importPreview').innerHTML = `<div class="alert alert-danger">Erro ao ler o arquivo: ${err.message}</div>`;
        }
      };
      reader.readAsArrayBuffer(file);
    });
  }

            <div class="mb-3">
              <label>Status</label>
              <select class="form-select" id="cotacaoStatus">
                <option value="Pendente">Pendente</option>
                <option value="Aprovada">Aprovada</option>
                <option value="Rejeitada">Rejeitada</option>
              </select>
            </div>
            <div class="mb-3">
              <label>Itens</label>
              <div id="cotacaoItens"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary" id="salvarCotacao">Salvar</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    const modalInstance = new bootstrap.Modal(modal);
    modalInstance.show();

    (async () => {
      const fornecedores = await getAll('fornecedores');
      const produtos = await getAll('produtos');
      const fornecedorSelect = document.getElementById('cotacaoFornecedor');
      const itensContainer = document.getElementById('cotacaoItens');
      const produtosParaExibir = produtosSelecionados.length ? produtos.filter(p => produtosSelecionados.includes(p.id)) : produtos;
      fornecedorSelect.innerHTML = fornecedores.map(f => `<option value="${f.id}">${f.nome}</option>`).join('');
      itensContainer.innerHTML = produtosParaExibir.map((p) => `
        <div class="row g-2 mb-2">
          <div class="col-md-5">
            <input class="form-control form-control-sm" value="${p.descricao}" readonly>
          </div>
          <div class="col-md-2">
            <input type="number" class="form-control form-control-sm cotacao-quantidade" data-produto="${p.id}" value="${quantidadesMap[p.id] || 0}" placeholder="Qtd">
          </div>
          <div class="col-md-2">
            <input type="number" step="0.01" class="form-control form-control-sm cotacao-preco" data-produto="${p.id}" value="${p.ultimo_preco || 0}" placeholder="Preço">
          </div>
          <div class="col-md-3">
            <input type="number" class="form-control form-control-sm cotacao-prazo" data-produto="${p.id}" value="${fornecedores.find(f => f.id === p.fornecedor_id)?.prazo_entrega || 3}" placeholder="Prazo">
          </div>
        </div>
      `).join('');
    })();

    document.getElementById('salvarCotacao').addEventListener('click', async () => {
      const data = document.getElementById('cotacaoData').value;
      const fornecedor_id = parseInt(document.getElementById('cotacaoFornecedor').value);
      const status = document.getElementById('cotacaoStatus').value;
      if (!fornecedor_id) {
        alert('Selecione um fornecedor para criar a cotação.');
        return;
      }
      const cotacao = { data, fornecedor_id, status };
      const cotacaoId = await add('cotacoes', cotacao);
      const itens = [];
      document.querySelectorAll('.cotacao-quantidade').forEach(input => {
        const produtoId = parseInt(input.dataset.produto);
        const quantidade = parseFloat(input.value) || 0;
        if (quantidade <= 0) return;
        const precoInput = document.querySelector(`.cotacao-preco[data-produto="${produtoId}"]`);
        const prazoInput = document.querySelector(`.cotacao-prazo[data-produto="${produtoId}"]`);
        itens.push({
          cotacao_id: cotacaoId,
          produto_id: produtoId,
          quantidade,
          preco_unitario: parseFloat(precoInput.value) || 0,
          prazo_entrega: parseInt(prazoInput.value) || 3,
        });
      });
      if (!itens.length) {
        alert('Adicione pelo menos um item na cotação.');
        return;
      }
      for (const item of itens) {
        await add('itens_cotacao', item);
      }
      await registrarEvento('cotação criada', `cotacao:${cotacaoId}`, `Cotação criada para o fornecedor ${fornecedor_id} com ${itens.length} itens.`);
      modalInstance.hide();
      renderCotacoes();
    });

    modal.addEventListener('hidden.bs.modal', () => modal.remove());
  }

  // ============================================================
  // 9. NAVEGAÇÃO E INICIALIZAÇÃO
  // ============================================================
  async function navigate(page) {
    currentPage = page;
    document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
    document.getElementById(`page-${page}`).classList.add('active');
    document.querySelectorAll('.sidebar .nav-link').forEach(el => el.classList.remove('active'));
    document.querySelector(`.sidebar .nav-link[data-page="${page}"]`)?.classList.add('active');

    const titles = {
      dashboard: 'Dashboard',
      produtos: 'Produtos',
      necessidade: 'Necessidade de Compra',
      fornecedores: 'Fornecedores',
      cotacoes: 'Cotações',
      pedidos: 'Pedidos',
      historico: 'Histórico',
      importar: 'Importar'
    };
    document.getElementById('pageTitle').textContent = titles[page] || page;

    switch (page) {
      case 'dashboard': await renderDashboard(); break;
      case 'produtos': await renderProdutos(); break;
      case 'necessidade': await renderNecessidade(); break;
      case 'fornecedores': await renderFornecedores(); break;
      case 'cotacoes': await renderCotacoes(); break;
      case 'pedidos': await renderPedidos(); break;
      case 'historico': await renderHistorico(); break;
      case 'importar': await renderImportar(); break;
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    await openDB();
    document.getElementById('loading').classList.remove('show');

    document.addEventListener('click', (e) => {
      if (e.target.matches('[data-bs-target="#modalCotacao"]')) {
        e.preventDefault();
        abrirModalCotacao();
      }
    });

    document.querySelectorAll('.sidebar .nav-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        navigate(link.dataset.page);
      });
    });

    document.getElementById('btnPopularDadosTeste').addEventListener('click', async () => {
      await popularDadosTeste();
    });

    document.getElementById('btnLimparDados').addEventListener('click', async () => {
      if (confirm('Deseja apagar todos os dados do sistema?')) {
        for (const store of STORES) {
          await clearStore(store);
        }
        alert('Dados limpos.');
        navigate('dashboard');
      }
    });

    navigate('dashboard');

    document.addEventListener('click', (e) => {
      if (e.target.matches('[data-bs-target="#modalProduto"]')) {
        e.preventDefault();
        abrirModalProduto();
      }
      if (e.target.matches('[data-bs-target="#modalFornecedor"]')) {
        e.preventDefault();
        abrirModalFornecedor();
      }
    });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
